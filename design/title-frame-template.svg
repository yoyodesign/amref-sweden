traight lines stretched to fit the title</text><rect x="60" y="1716" width="80" height="22" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="6 6"/><text x="155" y="1733" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Export each dashed box as its own SVG: A (left), B (right), C (step + spiral)</text><text x="60" y="1772" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="start" font-family="Helvetica, Arial, sans-serif">Rules for the pieces</text><text x="60" y="1802" fill="#CCCCCC" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif">• All horizontal lines must leave A, enter/leave C and enter B at the same heights (joins 1–4, plus the step height on C).</text><text x="60" y="1830" fill="#CCCCCC" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif">• Keep only maze detail inside the pieces — any straight run that needs to change length is left for the code to draw.</text><text x="60" y="1858" fill="#CCCCCC" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif">• B keeps the long vertical line that continues down the page; its length stays as it is.</text><text x="60" y="1886" fill="#CCCCCC" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica, Arial, sans-serif">• If titles can wrap to 3 lines, also leave the vertical edges of A and B plain so they can stretch taller.</text></svg>